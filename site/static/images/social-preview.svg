<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Tangible Mem</title>
  <desc id="description">Inspectable and correctable hierarchical memory for long-term research meetings.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1424"/>
      <stop offset="1" stop-color="#18233b"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="translate(195 100) rotate(39) scale(525 390)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2367d1" stop-opacity=".32"/>
      <stop offset="1" stop-color="#2367d1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(1090 530) rotate(-141) scale(450 335)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7044cf" stop-opacity=".3"/>
      <stop offset="1" stop-color="#7044cf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#blueGlow)"/>
  <rect width="1200" height="630" fill="url(#violetGlow)"/>
  <g transform="translate(88 94)">
    <rect width="80" height="16" rx="8" fill="#7193ff"/>
    <rect y="28" width="58" height="16" rx="8" fill="#8a65e5"/>
    <rect y="56" width="37" height="16" rx="8" fill="#d79a17"/>
  </g>
  <text x="88" y="270" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="700" letter-spacing="-4">Tangible Mem</text>
  <text x="92" y="353" fill="#dbe5f5" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Inspectable and Correctable Hierarchical Memory</text>
  <text x="92" y="405" fill="#aebdd3" font-family="Arial, Helvetica, sans-serif" font-size="32">for Long-Term Research Meetings</text>
  <g transform="translate(92 493)" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
    <rect width="174" height="52" rx="26" fill="#2367d1"/>
    <text x="87" y="34" fill="#ffffff" text-anchor="middle">INSPECT</text>
    <rect x="192" width="156" height="52" rx="26" fill="#7044cf"/>
    <text x="270" y="34" fill="#ffffff" text-anchor="middle">TRACE</text>
    <rect x="366" width="184" height="52" rx="26" fill="#007f75"/>
    <text x="458" y="34" fill="#ffffff" text-anchor="middle">CORRECT</text>
  </g>
  <text x="1112" y="536" fill="#8392aa" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="end">NYCU</text>
</svg>
